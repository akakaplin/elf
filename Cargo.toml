[package]
name = "elf"
version = "0.1.0"
edition = "2021"
description = "Multi-channel viewer over a raw orc parquet time-series store"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive"] }
duckdb = "1.10505.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }

# Size-tuned: 4.0 MB -> 1.9 MB. The heavy lifting is in libduckdb, which this
# does not touch, so the only Rust-side hot path -- serialising a large raw
# window -- measured within ~4% of opt-level 2. "z" is 360 KB smaller again but
# ~45% slower there. panic = "abort" would save another 400 KB, but would turn
# a panicking query from a 400 response into a dead server.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Debuginfo for our own crate only. Arrow alone is most of target/debug, and
# nobody steps through it: 945 MB -> 434 MB on a clean build.
[profile.dev.package."*"]
debug = false
